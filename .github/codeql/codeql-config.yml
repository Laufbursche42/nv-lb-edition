name: "nv-lb-edition CodeQL config"

queries:
  - uses: security-extended

# Only permanent by-design constants are excluded. Bug-class rules stay active; their real hits are
# fixed in the source, and the one unavoidable case (the protocol-mandated AES-ECB) is dismissed per alert.
query-filters:
  - exclude:
      id: java/android/missing-certificate-pinning        # third-party https hosts we do not control
  - exclude:
      id: java/android/webview-addjavascriptinterface     # local-only WebView, navigation locked
  - exclude:
      id: java/android/websettings-javascript-enabled     # required for the local dashboard
  - exclude:
      id: java/android/arbitrary-apk-installation         # intentional self-updater via the OS installer

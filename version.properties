# The version series, read by both app/build.gradle and the release workflow so the tag and
# the number inside the APK can never drift apart.
#
#   versionName = <major>.<minor>.<git commit count - patchZeroAt>
#   versionCode = codeBase + <git commit count>
#
# patchZeroAt is the commit count at which the patch level is 0, so moving to the next series
# means bumping minor and setting patchZeroAt to the commit count of the commit that does it.
# versionCode keeps counting straight through a series change and never goes backwards.
# The NAVEE edition starts its own series at 1.0.0 / code 1. The numbers of the app this was
# forked from are deliberately NOT carried over: they belong to a different app.
major=1
minor=0
patchZeroAt=0
codeBase=1
